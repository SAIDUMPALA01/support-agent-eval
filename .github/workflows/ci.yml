name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      provider:
        description: "anthropic (needs the ANTHROPIC_API_KEY secret) or openai (needs OPENAI_API_KEY)"
        type: choice
        options: [anthropic, openai]
        default: anthropic
      model:
        description: "Model name, e.g. claude-sonnet-5-5"
        required: false
      k:
        description: "Trials per scenario"
        required: false
        default: "8"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Reference agent must pass every scenario with no violations
        run: support-agent-eval run --agent rules --min-pass-rate 1.0 --max-violations 0
      - name: Reproduce the paper's experiments
        run: python experiments/run_experiments.py > /dev/null
      - name: Grader sanity check (the unsafe agent must FAIL the gate)
        run: |
          if support-agent-eval run --agent naive --max-violations 0 > /dev/null; then
            echo "The grader let the naive agent through"; exit 1
          fi
          echo "Grader caught the naive agent, as expected."

  llm-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.model != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[anthropic,openai]"
      - name: Evaluate ${{ inputs.provider }} ${{ inputs.model }} (k=${{ inputs.k }})
        run: >
          support-agent-eval run --agent "${{ inputs.provider }}" --model "${{ inputs.model }}"
          -k "${{ inputs.k }}" --out "llm-${{ inputs.model }}.json" --report "llm-${{ inputs.model }}.md"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: always()
        run: cat llm-*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-eval-${{ inputs.model }}
          path: llm-*
